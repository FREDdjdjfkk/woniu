<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>员工管理</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
<h2>员工信息管理</h2>

<div>
<!--    <input type="text" id="username" placeholder="用户名">-->
<!--    <input type="number" id="age" placeholder="年龄">-->
<!--    <input type="text" id="phonenumber" placeholder="联系方式">-->
    <input type="text" id="empno" placeholder="员工编号">
    <input type="text" id="ename" placeholder="员工姓名">
    <input type="text" id="job" placeholder="职位">
    <input type="text" id="mgr" placeholder="上级编号">
    <input type="text" id="sal" placeholder="工资">
    <input type="text" id="comm" placeholder="补偿金">
    <input type="text" id="deptno" placeholder="部门编号">
    <input type="date" id="hiredate" placeholder="入职时间">
    <button onclick="addEmp()">添加员工</button>
</div>

<br>

<table border="1" width="100%" id="empTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>员工名</th>
        <th>职位</th>
        <th>上级编号</th>
        <th>工资</th>
        <th>补偿金</th>
        <th>部门编号</th>
        <th>入职时间</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- 修改对话框 -->
<dialog id="updateDialog">
    <h3>修改员工信息</h3>
<!--    <input type="hidden" id="updateId">-->
<!--    <input type="text" id="updateUsername" placeholder="用户名">-->
<!--    <input type="number" id="updateAge" placeholder="年龄">-->
<!--    <input type="text" id="updatePhonenumber" placeholder="联系方式">-->
    <input type="hidden" id="updateempno" placeholder="员工编号">
    <input type="text" id="updateename" placeholder="员工姓名">
    <input type="text" id="updatejob" placeholder="职位">
    <input type="text" id="updatemgr" placeholder="上级编号">
    <input type="text" id="updatesal" placeholder="工资">
    <input type="text" id="updatecomm" placeholder="补偿金">
    <input type="text" id="updatedeptno" placeholder="部门编号">
    <input type="date" id="updatehiredate" placeholder="入职时间">

    <br><br>
    <button onclick="saveUpdate()">保存</button>
    <button onclick="document.getElementById('updateDialog').close()">取消</button>
</dialog>

<script>
    // 加载全部员工信息
    function loadAll() {
        $.get("/servlet/emp/list", function (data) {
            let tbody = $("#empTable tbody");
            tbody.empty();
            data.forEach(emp => {
                tbody.append(`
          <tr>
            <td>${emp.empno}</td>
            <td>${emp.ename}</td>
            <td>${emp.job}</td>
            <td>${emp.mgr}</td>
            <td>${emp.sal}</td>
            <td>${emp.comm}</td>
            <td>${emp.deptno}</td>
            <td>${emp.hiredate}</td>
            <td>
              <button onclick='showUpdateDialog(${JSON.stringify(emp)})'>修改</button>
              <button onclick='deleteEmp(${emp.empno})'>删除</button>
            </td>
          </tr>
        `);
            });
        });
    }

    // 添加员工
    function addEmp() {
        const emp = {
            empno: $("#empno").val(),
            ename: $("#ename").val(),
            job: $("#job").val(),
            mgr: $("#mgr").val(),
            sal: parseFloat($("#sal").val()) || 0,
            comm: parseFloat($("#comm").val()) || 0,
            deptno: parseInt($("#deptno").val()) || 0,
            hiredate: $("#hiredate").val() ? $("#hiredate").val()  : null
        };
        $.ajax({
            url: "/servlet/emp/add",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(emp),
            success: function () {
                alert("添加成功");
                loadAll();
                //清空
                $("#ename").val(""); $("#job").val(""); $("#mgr").val("");$("#sal").val("");$("#comm").val("");$("#deptno").val("");$("#hiredate").val("");
            }
        });
    }

    // 显示修改弹窗
    function showUpdateDialog(emp) {
        // $("#updateId").val(emp.id);
        // $("#updateUsername").val(emp.username);
        // $("#updateAge").val(emp.age);
        // $("#updatePhonenumber").val(emp.phonenumber);
        $("#updateempno").val(emp.empno);
        $("#updateename").val(emp.ename);
        $("#updatejob").val(emp.job);
        $("#updatemgr").val(emp.mgr);
        $("#updatesal").val(emp.sal);
        $("#updatedeptno").val(emp.deptno);
        $("#updatehiredate").val(emp.hiredate);
        document.getElementById("updateDialog").showModal();
    }

    // 保存修改
    function saveUpdate() {
        const emp = {
            // id: parseInt($("#updateempno").val()),
            // username: $("#updateename").val(),
            // age: parseInt($("#updateAge").val()),
            // phonenumber: $("#updatePhonenumber").val()
            empno: $("#updateempno").val(),
            ename: $("#updateename").val(),
            job: $("#updatejob").val(),
            mgr: $("#updatemgr").val(),
            sal: parseFloat($("#updatesal").val()),
            comm: parseFloat($("#updatecomm").val()),
            deptno: parseInt($("#updatedeptno").val()),
            // hiredate: $("#updatehiredate").val()
            //     ? $("#updatehiredate").val() + " 00:00:00"
            //     : null
            hiredate: $("#updatehiredate").val()
                ? $("#updatehiredate").val()
                : null
        };
        $.ajax({
            url: "/servlet/emp/update",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(emp),
            success: function () {
                alert("修改成功");
                document.getElementById("updateDialog").close();
                loadAll();
            }
        });
    }

    // 删除员工
    function deleteEmp(id) {
        if (!confirm("确认删除？")) return;
        $.ajax({
            url: "/servlet/emp/delete",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ id }),
            success: function () {
                alert("删除成功");
                loadAll();
            }
        });
    }

    // 页面加载完成时执行
    $(function () {
        loadAll();
    });
</script>
</body>
</html>
