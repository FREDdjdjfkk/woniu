<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>员工管理</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
<h2>员工信息管理</h2>

<div>
    <input type="text" id="username" placeholder="用户名">
    <input type="number" id="age" placeholder="年龄">
    <input type="text" id="phonenumber" placeholder="联系方式">
    <button onclick="addEmp()">添加员工</button>
</div>

<br>

<table border="1" width="100%" id="empTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>年龄</th>
        <th>联系方式</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- 修改对话框 -->
<dialog id="updateDialog">
    <h3>修改员工信息</h3>
    <input type="hidden" id="updateId">
    <input type="text" id="updateUsername" placeholder="用户名">
    <input type="number" id="updateAge" placeholder="年龄">
    <input type="text" id="updatePhonenumber" placeholder="联系方式">
    <br><br>
    <button onclick="saveUpdate()">保存</button>
    <button onclick="document.getElementById('updateDialog').close()">取消</button>
</dialog>

<script>
    // 加载全部员工信息
    function loadAll() {
        $.get("/survlet/emp/list", function (data) {
            let tbody = $("#empTable tbody");
            tbody.empty();
            data.forEach(emp => {
                tbody.append(`
          <tr>
            <td>${emp.id}</td>
            <td>${emp.username}</td>
            <td>${emp.age}</td>
            <td>${emp.phonenumber}</td>
            <td>
              <button onclick='showUpdateDialog(${JSON.stringify(emp)})'>修改</button>
              <button onclick='deleteEmp(${emp.id})'>删除</button>
            </td>
          </tr>
        `);
            });
        });
    }

    // 添加员工
    function addEmp() {
        const emp = {
            username: $("#username").val(),
            age: parseInt($("#age").val()),
            phonenumber: $("#phonenumber").val()
        };
        $.ajax({
            url: "/survlet/emp/add",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(emp),
            success: function () {
                alert("添加成功");
                loadAll();
                $("#username").val(""); $("#age").val(""); $("#phonenumber").val("");
            }
        });
    }

    // 显示修改弹窗
    function showUpdateDialog(emp) {
        $("#updateId").val(emp.id);
        $("#updateUsername").val(emp.username);
        $("#updateAge").val(emp.age);
        $("#updatePhonenumber").val(emp.phonenumber);
        document.getElementById("updateDialog").showModal();
    }

    // 保存修改
    function saveUpdate() {
        const emp = {
            id: parseInt($("#updateId").val()),
            username: $("#updateUsername").val(),
            age: parseInt($("#updateAge").val()),
            phonenumber: $("#updatePhonenumber").val()
        };
        $.ajax({
            url: "/survlet/emp/update",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(emp),
            success: function () {
                alert("修改成功");
                document.getElementById("updateDialog").close();
                loadAll();
            }
        });
    }

    // 删除员工
    function deleteEmp(id) {
        if (!confirm("确认删除？")) return;
        $.ajax({
            url: "/survlet/emp/delete",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ id }),
            success: function () {
                alert("删除成功");
                loadAll();
            }
        });
    }

    // 页面加载完成时执行
    $(function () {
        loadAll();
    });
</script>
</body>
</html>
