<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="GBK">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 链接未访问的样式 */
        a:link{
            color: red;
        }
        /*链接访问过的样式  */
        a:visited{
            color: blue;
        }
        /* 鼠标移入时的样式 */
        a:hover{
            color: yellow;
        }
        /* 鼠标点击链接时的样式 */
        a:active{
            color: chocolate;
        }

        /* link和visited是a标签独有的 */
    </style>
</head>
<body>
    <a href="#">标签</a>
</body>
</html>
