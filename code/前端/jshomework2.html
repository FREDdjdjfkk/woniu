<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let sum1=0
        let sum2=0
        for(let i=0;i<=100;i++){
            if(i%2!=0){
                sum1+=i
            }else{
                sum2+=i
            }
            console.log('奇数和：',sum1);
            console.log('偶数和：',sum2);
        }
    </script>
</body>
</html>
