<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .box{
        width: 400px;
        height: 400px;
        background-color: aqua;
    }   
    .box1{
        width: 200px ;
        height: 200px;
        background-color: bisque;
        position: fixed;
        right: 0;
    }     

    .box2{
        width: 100px;
        height: 100px;
        background-color: blueviolet;
        position: relative;
        left: 5px;
    }
    .box3{
        width: 50px;
        height: 50px;
        background-color: white;
        position: absolute;
        top: 30px;
    }


    </style>

</head>
<body>
    <div class="box">
        <div class="box1">
            fixed定位
            <div class="box2">
                <div class="box3"></div>
            </div>
         </div>
         asdfasdf
        <div class="box2">
            <div class="box3"></div>
            asdfasdf
        </div>
    </div>
    <div class="box2">
        相对定位
        <div class="box3">绝对定位</div>
    </div>
</body>
</html>
