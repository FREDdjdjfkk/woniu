<html>


<body>
    <!-- disc默认值，square 实心圆 circle 空心圆 -->
     <!-- ul 无序列表 -->
    <ul type="">
    <li>html</li>
    <li>css</li>
    <li>js</li>
    </ul>

    <!-- ol有序列表 -->
    <!-- type指定列表符号，默认值是1 -->
     <ol>
    <li>html</li>
    <li>css</li>
    <li>js</li>
     </ol>
    <!-- dl：定义列表 -->
     <dl>
    <dd>计算机学苑</dd>
    <dd>物联网</dd>
    <dd>java</dd>
     </dl>
</body>
</html>
