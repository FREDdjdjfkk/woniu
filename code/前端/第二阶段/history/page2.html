<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page2</title>
</head>
<body>
    <script>
        function backpage() {
        history.back();
    }
     function nextpage() {
        history.forward();
    }    
    </script>

    <input type="button" value="nextpage"   onclick="nextpage()"></input>
    <input type="button" value="backpage"   onclick="backpage()"></input>

</body>
</html>
