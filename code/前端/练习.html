<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 900px;
            height: 900px;
            position: relative;
            top: 50px;
            left: 50px;
            border: 1px solid black;
        }
        .box1{
            width: 300px;
            height: 300px;
            background-color: pink;
            position: absolute;
        }
        .box2{
            width: 300px;
            height: 300px;
            background-color: purple;
            position: absolute;
            right: 0;
        }
        .box3{
            width: 300px;
            height: 300px;
            background-color: rgb(0, 128, 73);
            position: absolute;
            right: 300px;
            top: 300px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box1" style="bottom: 0;
        right: 0;">4</div>
        <div class="box2" style="bottom: 0;left: 0;">5</div>
    </div>
</body>
</html>
