<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 330px;
            background-color: white;
            border: 1px solid;
            padding: 20px;
        }

        .input {
            width: 300px;
            height: 33px;
            outline: none;
        }

        .password-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 288px;
            padding: 10px;
            border: 1px solid black;
            border-radius: 1px;
        }

        .password-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        a.forgot-password {
            font-size: 12px;
            color: rgb(96, 93, 93);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .button {
            width: 310px;
            height: 30px;
            background-color: orange;
            border: 1px solid;
            margin-top: 10px;
        }

        a {
            color: blue;
            font-size: 12px;
            text-decoration: none;
        }

        .text {
            font-size: 12px;
        }

        .box1 {
            width: 100%;
            height: 30px;
            background-image: url('./前端/img/software-logo.png');
            background-repeat: no-repeat;
            margin-top: 10px;
        }

        /* 浮动布局相关样式 */
        .row {
            margin-bottom: 10px;
            overflow: hidden; /* 清除浮动 */
        }

        .col {
            padding: 0 10px;
            float: left;
        }

        .col-right {
            float: right;
        }
    </style>
</head>
<body>
    <div class="box">
        <!-- 第一行 -->
        <div class="row">
            <div class="col">
                <span style="font-weight: 400;">账号密码登录</span>
            </div>
            <div class="col-right">
                <span style="font-weight: 200; font-size: 10px;">手机号查单</span>
            </div>
        </div>

        <!-- 第二行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <input class="input" type="text" name="username" id="username" placeholder="国内手机号/用户名/邮箱/卡号" >
            </div>
        </div>

        <!-- 第三行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <div class="password-container">
                    <input type="password" class="password-input" placeholder="登录密码">
                    <a href="#" class="forgot-password">忘记密码</a>
                </div>
            </div>
        </div>

        <!-- 第四行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <button class="button">登录</button>
            </div>
        </div>

        <!-- 第五行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <div class="text">
                    <input type="checkbox">阅读并同意携程的
                    <a href="">服务协议</a>和
                    <a href="">个人信息保护政策</a>
                </div>
            </div>
        </div>

        <!-- 第六行 -->
        <div class="row">
            <div class="col">
                <a href="">验证码登录</a>
            </div>
            <div class="col-right">
                <a href="">免费注册</a>
            </div>
        </div>

        <!-- 第七行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <!-- <span>境外手机  |   公司客户    |   携程通</span> -->
                 <span class="col">境外手机&nbsp&nbsp&nbsp|</span>
                 <span class="col">公司客户&nbsp&nbsp&nbsp|</span>
                 <span class="col">携程通</span>
            </div>
        </div>

        <!-- 第八行 -->
        <div class="row">
            <div class="col" style="width: 100%;">
                <div class="box1"></div>
            </div>
        </div>
    </div>
</body>
</html>
