    function add() {
        var username = document.getElementById("username").value;
        var age = document.getElementById("age").value;
        var phonenumber = document.getElementById("phonenumber").value;
        var table = document.getElementById("userTable").getElementsByTagName("tbody")[0];

        var tbody = document.getElementsByTagName("tbody")[0];
        var tr =document.createElement("tr");
        var td1 =document.createElement("td");
        var td2 =document.createElement("td");
        var td3 =document.createElement("td");
        var td4 =document.createElement("td");
        var deleteButton = document.createElement("button");
        deleteButton.textContent = "删除";
        deleteButton.onclick = function() {
            tr.remove();
        };
        td4.appendChild(deleteButton);
        var modifyButton = document.createElement("button");
        modifyButton.textContent = "修改";
        var text1=document.createTextNode(username);
        var text2=document.createTextNode(age);
        var text3=document.createTextNode(phonenumber);
        modifyButton.onclick = function() {
            dialog(text1, text2, text3);
        };
        td4.appendChild(modifyButton);
        td1.appendChild(text1);
        td2.appendChild(text2);
        td3.appendChild(text3);
        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        table.appendChild(tr);
    }
    
    function dialog(text1, text2, text3) {
        var dialog = document.getElementById("modifyDialog");
        var modifyUsernameInput = document.getElementById("modifyUsername");
        var modifyAgeInput = document.getElementById("modifyAge");
        var modifyPhonenumberInput = document.getElementById("modifyPhonenumber");
        var modifySaveButton = document.getElementById("modifySaveButton");
        var modifyCancelButton = document.getElementById("modifyCancelButton");
        dialog.showModal();
        modifySaveButton.onclick = function() {
            text1.nodeValue = modifyUsernameInput.value;
            text2.nodeValue = modifyAgeInput.value;
            text3.nodeValue = modifyPhonenumberInput.value;
            dialog.close();
        };
        modifyCancelButton.onclick = function() {
                dialog.close();
            };

    }
